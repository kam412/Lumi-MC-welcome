name: Build LumiWelcome

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check Java version
        run: |
          java -version
          javac -version

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: LumiWelcome
          path: target/LumiWelcome-1.0.jar
